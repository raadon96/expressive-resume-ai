# Personal Paths: directories whose contents belong to one user's own job
# search. Empty (a .gitkeep only) in the Public Template Repo, populated only
# in a Private Fork, and never flowing back through sync. Everything else is a
# Shared Path.
#
# This is the single declaration. The git hooks, the sync scripts and CI all
# source this file — add a path here and every guard picks it up.
#
# Sourced by bash: keep it a plain array assignment, no other logic.
# shellcheck disable=SC2034
PERSONAL_PATHS=(profile applications templates)
