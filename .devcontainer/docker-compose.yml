services:
  vscode:
    build: .
    image: latexdevcontainer
    volumes:
      - ../:/workspace
      # Claude Code login and global config (persists /login across rebuilds)
      - claude-code:/root/.claude
    environment:
      - TZ=
      # Keeps Claude Code's global config (.claude.json) in the volume too
      - CLAUDE_CONFIG_DIR=/root/.claude
    entrypoint: ["zsh", "-c", "while sleep 1000; do :; done"]

volumes:
  claude-code:
    name: expressive-resume-ai-claude-code
