name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-templates:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scaffold resume and cover letter
        # Mirror the data/ layout so the scaffold's ../../profile/ QR path resolves.
        run: |
          export TEXINPUTS=".:$GITHUB_WORKSPACE/src:"
          mkdir -p "$RUNNER_TEMP/data/applications/scaffold"
          cp -R example/profile "$RUNNER_TEMP/data/profile"
          cp src/scaffold/application/*.tex "$RUNNER_TEMP/data/applications/scaffold/"
          cd "$RUNNER_TEMP/data/applications/scaffold"
          latexmk -pdf -r "$GITHUB_WORKSPACE/.latexmkrc" resume.tex
          latexmk -pdf -r "$GITHUB_WORKSPACE/.latexmkrc" coverletter.tex
      - name: Build example application
        run: |
          export TEXINPUTS=".:$GITHUB_WORKSPACE/src:"
          cd "example/applications/26.04.26_mleng@ExampleCompany"
          latexmk -pdf -r "$GITHUB_WORKSPACE/.latexmkrc" resume.tex
          latexmk -pdf -r "$GITHUB_WORKSPACE/.latexmkrc" coverletter.tex

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck setup.sh new-application.sh
