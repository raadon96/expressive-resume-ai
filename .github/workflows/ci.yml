name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck setup.sh src/build.sh tests/*.sh
      - name: No personal data in the Tool Repo
        run: test -z "$(git ls-files data/)"
      - name: .claude/settings.json denies git clean
        run: jq -e '.permissions.deny | any(. == "Bash(git clean:*)")' .claude/settings.json

  # Option B, local install
  setup:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      # Before checkout, so it clones a git repo for tests/test-setup.sh
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v4
      - name: Run tests/test-setup.sh
        run: tests/test-setup.sh
